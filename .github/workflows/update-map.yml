name: Sync map from Google My Maps
on:
  schedule:
    - cron: "0 12 * * *"   # daily at midnight NZ time
  workflow_dispatch:        # allows a manual "Run workflow" button too
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest KML
        run: |
          curl -fsSL "${{ vars.MAP_ID }}&forcekml=1" -o HMH-FFFF.kml
          grep -q "<kml" HMH-FFFF.kml   # sanity check it's real KML, not an error page
      - name: Commit if changed
        run: |
          git config user.name "map-sync-bot"
          git config user.email "actions@github.com"
          git add HMH-FFFF.kml
          git diff --cached --quiet || git commit -m "Auto-sync map from Google My Maps"
          git push
